<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Endeavor Colorado — Selection Funnel Portal</title>
<meta name="theme-color" content="#16213e" />
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#1a1a2e;--muted:#6b7280;--line:#e6e8f0;--accent:#2563eb;--navy:#16213e;--light:#eef2fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);}
a{color:var(--accent);text-decoration:none;}a:hover{text-decoration:underline;}
.muted{color:var(--muted);}
.center{display:grid;place-items:center;min-height:70vh;padding:24px;text-align:center;}
.topbar{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;}
.brand{font-weight:700;letter-spacing:.2px;line-height:1.15;}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.7;letter-spacing:.5px;}
.topright{display:flex;align-items:center;gap:12px;}
.countbadge{font-size:12px;background:rgba(255,255,255,.14);padding:5px 10px;border-radius:999px;}
.topbar button{background:rgba(255,255,255,.12);color:#fff;border:0;padding:7px 12px;border-radius:8px;cursor:pointer;font-size:13px;}
.topbar button:hover{background:rgba(255,255,255,.24);}
.wrap{max-width:1180px;margin:0 auto;padding:16px 20px 40px;}
.ribbon{display:flex;gap:10px;overflow-x:auto;padding:14px 0 6px;align-items:stretch;}
.ribbon-label{flex:0 0 auto;align-self:center;font-size:10px;font-weight:700;letter-spacing:.8px;color:var(--muted);padding-right:2px;}
.news{flex:0 0 auto;max-width:320px;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13px;cursor:pointer;}
.news:hover{border-color:var(--accent);}
.news .h{font-weight:600;line-height:1.3;}
.news .d{color:var(--muted);font-size:11px;margin-top:4px;}
.tabs{display:flex;gap:8px;margin:14px 0 12px;}
.tab{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:14px;}
.tab.on{background:var(--navy);color:#fff;border-color:var(--navy);}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.schip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:6px 11px;cursor:pointer;font-size:13px;}
.schip b{background:var(--light);border-radius:6px;padding:1px 7px;font-size:12px;}
.schip.on{background:var(--navy);color:#fff;}.schip.on b{background:rgba(255,255,255,.2);color:#fff;}
.schip .dot{width:9px;height:9px;border-radius:50%;}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px;}
.filters input,.filters select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:#fff;}
.filters input{min-width:240px;}
.clearbtn{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px;}
.showing{color:var(--muted);font-size:12px;margin-left:auto;}
.tier{margin:22px 0 8px;display:flex;align-items:center;gap:10px;}
.tier .dot{width:12px;height:12px;border-radius:50%;}
.tier h2{font-size:15px;margin:0;}
.tier .count{color:var(--muted);font-size:13px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(248px,1fr));gap:12px;}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;cursor:pointer;transition:box-shadow .15s,transform .15s;position:relative;}
.card:hover{box-shadow:0 6px 20px rgba(20,33,62,.10);transform:translateY(-2px);}
.card .top{display:flex;align-items:center;gap:10px;}
.card .logo{width:40px;height:40px;border-radius:9px;object-fit:contain;background:#f1f3f9;border:1px solid var(--line);}
.card .face{width:34px;height:34px;border-radius:50%;object-fit:cover;margin-left:-14px;border:2px solid #fff;background:#eee;}
.card .name{font-weight:700;font-size:15px;margin:10px 0 2px;}
.card .sub{color:var(--muted);font-size:12px;min-height:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.card .stats{display:flex;gap:12px;margin-top:10px;font-size:12px;}
.card .stats b{display:block;font-size:13px;color:var(--ink);}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;min-height:19px;}
.chip{font-size:10.5px;background:var(--light);color:#33415c;padding:2px 7px;border-radius:999px;}
.tierdot{position:absolute;top:12px;right:12px;width:10px;height:10px;border-radius:50%;}
.invrow{display:flex;align-items:center;justify-content:space-between;background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 14px;margin-bottom:8px;cursor:pointer;}
.invrow:hover{box-shadow:0 4px 14px rgba(20,33,62,.08);}
.invrow .n{font-weight:600;}.invrow .c{color:var(--muted);font-size:13px;}
.overlay{position:fixed;inset:0;background:rgba(15,20,35,.45);display:grid;place-items:center;padding:20px;z-index:50;}
.modal{background:#fff;border-radius:16px;max-width:680px;width:100%;max-height:86vh;overflow:auto;padding:22px;}
.modal .mhead{display:flex;align-items:center;gap:12px;}
.modal .mhead img.logo{width:52px;height:52px;border-radius:11px;object-fit:contain;background:#f1f3f9;border:1px solid var(--line);}
.modal h2{margin:0;font-size:21px;}
.fieldgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 22px;margin-top:16px;}
.field label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);}
.field div{font-size:14px;margin-top:2px;}
.full{grid-column:1 / -1;}
.x{float:right;border:0;background:var(--light);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:16px;}
.foot{font-size:11.5px;margin-top:22px;}
.login{max-width:380px;margin:12vh auto;background:#fff;border:1px solid var(--line);border-radius:16px;padding:28px;text-align:center;}
.login h1{font-size:20px;margin:6px 0 2px;}
.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:9px;margin:14px 0;font-size:14px;}
.login button{width:100%;padding:11px;background:var(--accent);color:#fff;border:0;border-radius:9px;font-size:15px;cursor:pointer;}
.err{color:#c0392b;font-size:13px;margin-top:10px;}
@media (max-width:560px){.filters input{min-width:100%;}.showing{margin-left:0;}}
</style>
</head>
<body>
<div id="root"><div class="center muted">Loading…</div></div>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
<script type="text/babel" data-type="module" data-presets="react">
import React, { useState, useEffect, useMemo } from "https://esm.sh/react@18.3.1";
import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
import { createClient } from "https://esm.sh/@supabase/supabase-js@2.45.4";

// ---- config (publishable values; safe to expose, RLS protects data) ----
const SUPABASE_URL = "https://yosskkaifoztmcgwqxhq.supabase.co";
const SUPABASE_KEY = "sb_publishable_oyhY4up7RJNKv9CIsotMBA_f95P-04Q";
const LOGODEV_TOKEN = ""; // optional: add your logo.dev publishable token for higher-res brand logos. Leave blank = keyless Google/DuckDuckGo favicons.
const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

const TIERS = [
  { key:'Selected', label:'Selected · Endeavor Entrepreneurs', short:'Selected', color:'#0E7C66' },
  { key:'P1', label:'P1 · Ready Now', short:'P1', color:'#2E7D32' },
  { key:'P2', label:'P2 · Ready Soon', short:'P2', color:'#1565C0' },
  { key:'P3', label:'P3 · Momentum', short:'P3', color:'#6A1B9A' },
  { key:'P4', label:'P4 · Watchlist', short:'P4', color:'#E65100' },
];
const tierColor = (t)=> (TIERS.find(x=>x.key===t)||{}).color || '#94a3b8';
const usd = (n)=> n==null?'—': n>=1e9?`$${(n/1e9).toFixed(1)}B` : n>=1e6?`$${(n/1e6).toFixed(1)}M` : n>=1e3?`$${Math.round(n/1e3)}K` : `$${n}`;
const domainFrom = (w)=>{ if(!w) return null; try{ return new URL(w.startsWith('http')?w:'https://'+w).hostname.replace(/^www\./,'') }catch{ return null } };
const companyDomain = (c)=> c.domain||domainFrom(c.website);
const logoUrl = (c)=>{ const d=companyDomain(c); if(!d) return null; return LOGODEV_TOKEN?`https://img.logo.dev/${d}?token=${LOGODEV_TOKEN}&size=128&format=png&retina=true&fallback=monogram`:`https://www.google.com/s2/favicons?sz=256&domain=${d}`; };
const fbChain = (d)=> LOGODEV_TOKEN ? [`https://www.google.com/s2/favicons?sz=256&domain=${d}`,`https://icons.duckduckgo.com/ip3/${d}.ico`] : [`https://icons.duckduckgo.com/ip3/${d}.ico`];
const onLogoErr = (d)=> (e)=>{ const t=e.currentTarget; if(!d){ t.style.visibility='hidden'; return; } const step=parseInt(t.dataset.fb||'0',10); const chain=fbChain(d); if(step<chain.length){ t.dataset.fb=String(step+1); t.src=chain[step]; } else { t.style.visibility='hidden'; } };
const avatarUrl = (name)=> `https://api.dicebear.com/9.x/initials/svg?seed=${encodeURIComponent(name||'Founder')}&radius=50`;

function App(){
  const [session,setSession]=useState(null); const [ready,setReady]=useState(false);
  useEffect(()=>{
    supabase.auth.getSession().then(({data})=>{ setSession(data.session); setReady(true); });
    const { data:sub }=supabase.auth.onAuthStateChange((_e,s)=>setSession(s));
    return ()=> sub.subscription.unsubscribe();
  },[]);
  if(!ready) return <div className="center muted">Loading…</div>;
  if(!session) return <Login/>;
  return <Portal/>;
}

function Login(){
  const [email,setEmail]=useState(''); const [sent,setSent]=useState(false); const [err,setErr]=useState(null);
  const send=async(e)=>{ e.preventDefault(); setErr(null); const {error}=await supabase.auth.signInWithOtp({email}); if(error) setErr(error.message); else setSent(true); };
  return (
    <div className="login">
      <div className="brand" style={{color:'#16213e'}}>ENDEAVOR COLORADO</div>
      <h1>Selection Funnel Portal</h1>
      <p className="muted" style={{fontSize:13}}>Team access only. Enter your Endeavor email for a sign-in link.</p>
      {sent ? <p style={{marginTop:18}}>Check your inbox — a magic sign-in link is on its way.</p> :
      <form onSubmit={send}>
        <input type="email" required placeholder="you@endeavor.org" value={email} onChange={e=>setEmail(e.target.value)} />
        <button type="submit">Send sign-in link</button>
        {err && <div className="err">{err}</div>}
      </form>}
    </div>
  );
}

function Portal(){
  const [companies,setCompanies]=useState([]); const [fundings,setFundings]=useState([]);
  const [loading,setLoading]=useState(true); const [err,setErr]=useState(null);
  const [view,setView]=useState('board'); const [q,setQ]=useState(''); const [tier,setTier]=useState('');
  const [vertical,setVertical]=useState(''); const [investor,setInvestor]=useState(''); const [active,setActive]=useState(null);
  useEffect(()=>{ (async()=>{
    const { data,error }=await supabase.from('companies').select('id,name,overview,founder_team,timing,year_founded,vertical,last_series,last_raise_date,last_raise_amount,total_funding,valuation,tier,stage,website,domain,hq,co_based,last_verified,founders(name,role,is_ceo,photo_url),company_investors(is_lead,investors(name))').order('name');
    if(error) setErr(error.message); else setCompanies(data||[]);
    const { data:f }=await supabase.from('fundings').select('headline,news_url,published_at,amount,series,companies(name)').eq('approved',true).order('published_at',{ascending:false}).limit(15);
    setFundings(f||[]); setLoading(false);
  })(); },[]);
  const verticals=useMemo(()=>[...new Set(companies.flatMap(c=>c.vertical||[]))].sort(),[companies]);
  const tierCounts=useMemo(()=>{ const m={}; companies.forEach(c=>{m[c.tier]=(m[c.tier]||0)+1}); return m; },[companies]);
  const investorIndex=useMemo(()=>{ const m=new Map(); companies.forEach(c=>(c.company_investors||[]).forEach(ci=>{const n=ci.investors?.name; if(!n)return; if(!m.has(n))m.set(n,[]); m.get(n).push(c);})); return [...m.entries()].sort((a,b)=>b[1].length-a[1].length); },[companies]);
  const filtered=companies.filter(c=>{
    if(tier && c.tier!==tier) return false;
    if(vertical && !(c.vertical||[]).includes(vertical)) return false;
    if(investor && !(c.company_investors||[]).some(ci=>ci.investors?.name===investor)) return false;
    if(q){ const hay=`${c.name} ${c.founder_team||''} ${c.overview||''}`.toLowerCase(); if(!hay.includes(q.toLowerCase())) return false; }
    return true;
  });
  const groups=useMemo(()=>{ const known=TIERS.map(t=>t.key); const map={}; filtered.forEach(c=>{const k=known.includes(c.tier)?c.tier:'Other';(map[k]=map[k]||[]).push(c);}); return map; },[filtered]);
  const anyFilter=q||tier||vertical||investor;
  const clear=()=>{setQ('');setTier('');setVertical('');setInvestor('');};
  const openByName=(name)=>{ const m=companies.find(c=>c.name===name); if(m) setActive(m); };
  const freshness=companies.find(c=>c.last_verified)?.last_verified;
  return (
    <>
      <div className="topbar">
        <div className="brand">Selection Funnel Portal<small>ENDEAVOR COLORADO</small></div>
        <div className="topright"><span className="countbadge">{companies.length} companies</span><button onClick={()=>supabase.auth.signOut()}>Sign out</button></div>
      </div>
      <div className="wrap">
        {err && <div className="err">Couldn’t load data: {err}</div>}
        {fundings.length>0 && <div className="ribbon"><span className="ribbon-label">RECENT RAISES</span>
          {fundings.map((f,i)=><button key={i} className="news" onClick={()=>openByName(f.companies?.name)}><div className="h">{f.headline||`${f.companies?.name||'A company'} raised ${usd(f.amount)}`}</div><div className="d">{f.series?f.series+' · ':''}{f.published_at||''}</div></button>)}
        </div>}
        <div className="tabs">
          <div className={`tab ${view==='board'?'on':''}`} onClick={()=>setView('board')}>Funnel</div>
          <div className={`tab ${view==='investors'?'on':''}`} onClick={()=>setView('investors')}>Investors</div>
        </div>
        {view==='board' && <>
          <div className="summary">{TIERS.map(t=><button key={t.key} className={`schip ${tier===t.key?'on':''}`} style={{borderColor:t.color}} onClick={()=>setTier(tier===t.key?'':t.key)}><span className="dot" style={{background:t.color}}/>{t.short}<b>{tierCounts[t.key]||0}</b></button>)}</div>
          <div className="filters">
            <input placeholder="Search company, founder, overview…" value={q} onChange={e=>setQ(e.target.value)} />
            <select value={vertical} onChange={e=>setVertical(e.target.value)}><option value="">All verticals</option>{verticals.map(v=><option key={v} value={v}>{v}</option>)}</select>
            <select value={investor} onChange={e=>setInvestor(e.target.value)}><option value="">All investors</option>{investorIndex.map(([n])=><option key={n} value={n}>{n}</option>)}</select>
            {anyFilter && <button className="clearbtn" onClick={clear}>Clear filters</button>}
            <span className="showing">{filtered.length} of {companies.length}</span>
          </div>
          {loading && <p className="muted">Loading funnel…</p>}
          {!loading && filtered.length===0 && <p className="muted">No companies match — adjust filters.</p>}
          {[...TIERS.map(t=>t.key),'Other'].map(key=>{ const list=groups[key]; if(!list||!list.length) return null; const meta=TIERS.find(t=>t.key===key);
            return <section key={key}><div className="tier"><span className="dot" style={{background:tierColor(key)}}/><h2>{meta?meta.label:'Other / Reviewing'}</h2><span className="count">{list.length}</span></div>
              <div className="grid">{list.map(c=><Card key={c.id} c={c} onClick={()=>setActive(c)}/>)}</div></section>;
          })}
        </>}
        {view==='investors' && <>
          <p className="muted" style={{fontSize:13,marginTop:4}}>Who is talking to whom — click a fund to see the funnel companies it touches.</p>
          {investorIndex.length===0 && <p className="muted">No investor links yet.</p>}
          {investorIndex.map(([name,list])=><div key={name} className="invrow" onClick={()=>{setInvestor(name);setView('board');}}><span className="n">{name}</span><span className="c">{list.length} {list.length===1?'company':'companies'} in funnel →</span></div>)}
        </>}
        {freshness && <div className="foot muted">Data from your Notion funnel · last verified {freshness}</div>}
      </div>
      {active && <CompanyModal c={active} onClose={()=>setActive(null)}/>}
    </>
  );
}

function Card({c,onClick}){
  const founder=(c.founders&&c.founders[0])||null; const logo=logoUrl(c);
  return (
    <div className="card" onClick={onClick}>
      <span className="tierdot" style={{background:tierColor(c.tier)}} title={c.tier}/>
      <div className="top">{logo?<img className="logo" src={logo} alt="" onError={onLogoErr(companyDomain(c))}/>:<div className="logo"/>}<img className="face" src={founder?.photo_url||avatarUrl(founder?.name||c.name)} alt=""/></div>
      <div className="name">{c.name}</div>
      <div className="sub">{founder?.name || (c.hq||'')}</div>
      <div className="chips">{(c.vertical||[]).slice(0,3).map(v=><span key={v} className="chip">{v}</span>)}</div>
      <div className="stats"><div><span className="muted">Last round</span><b>{c.last_series||'—'}</b></div><div><span className="muted">Raised</span><b>{usd(c.last_raise_amount)}</b></div><div><span className="muted">Valuation</span><b>{usd(c.valuation)}</b></div></div>
    </div>
  );
}

function CompanyModal({c,onClose}){
  const logo=logoUrl(c);
  const investors=[...new Set((c.company_investors||[]).map(ci=>ci.investors?.name).filter(Boolean))];
  const founderNames=(c.founders||[]).map(f=>f.name).filter(Boolean);
  const F=({label,children,full})=> <div className={`field ${full?'full':''}`}><label>{label}</label><div>{children||'—'}</div></div>;
  return (
    <div className="overlay" onClick={onClose}>
      <div className="modal" onClick={e=>e.stopPropagation()}>
        <button className="x" onClick={onClose}>×</button>
        <div className="mhead">{logo?<img className="logo" src={logo} alt="" onError={onLogoErr(companyDomain(c))}/>:<div className="logo" style={{width:52,height:52}}/>}
          <div><h2>{c.name}</h2><div className="muted" style={{fontSize:13}}><span style={{color:tierColor(c.tier),fontWeight:600}}>{c.tier||'—'}</span>{c.stage?` · ${c.stage}`:''}{c.hq?` · ${c.hq}`:''}{c.co_based?' · Colorado':''}</div></div>
        </div>
        <div className="fieldgrid">
          <F label="Company overview" full>{c.overview}</F>
          <F label="Founder / team" full>{founderNames.length?founderNames.join(', '):c.founder_team}</F>
          <F label="Timing" full>{c.timing}</F>
          <F label="Year founded">{c.year_founded}</F>
          <F label="Vertical">{(c.vertical||[]).join(', ')}</F>
          <F label="Last funding series">{c.last_series}</F>
          <F label="Last raise date">{c.last_raise_date}</F>
          <F label="Last funding amount">{usd(c.last_raise_amount)}</F>
          <F label="Total funding">{usd(c.total_funding)}</F>
          <F label="Valuation">{usd(c.valuation)}</F>
          <F label="Investors" full>{investors.join(', ')}</F>
          {c.domain && <F label="Website" full><a href={`https://${c.domain}`} target="_blank" rel="noreferrer">{c.domain}</a></F>}
        </div>
        {c.last_verified && <div className="foot muted" style={{marginTop:14}}>Last verified {c.last_verified} · source: Notion</div>}
      </div>
    </div>
  );
}

createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
